<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL FINANCE</p>
        <h1>Expense Tracker</h1>
        <p class="subtitle">Track, edit and manage your expenses.</p>
      </div>
      <div class="header-badge">Expense App</div>
    </header>

    <main>
      <section class="summary-grid">
        <div class="summary-card">
          <span>Total Expenses</span>
          <strong id="totalExpenses">0</strong>
        </div>
        <div class="summary-card">
          <span>Total Spent</span>
          <strong id="totalAmount">₹0.00</strong>
        </div>
        <div class="summary-card">
          <span>Average Expense</span>
          <strong id="averageAmount">₹0.00</strong>
        </div>
      </section>

      <section class="content-grid">
        <div class="panel form-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">ADD / EDIT</p>
              <h2 id="formTitle">Add Expense</h2>
            </div>
          </div>

          <form id="expenseForm">
            <input type="hidden" id="expenseId">

            <label for="description">Description</label>
            <input
              id="description"
              type="text"
              placeholder="e.g. Dinner with friends"
              maxlength="255"
              required
            >

            <label for="amount">Amount</label>
            <input
              id="amount"
              type="number"
              placeholder="e.g. 450"
              min="0.01"
              step="0.01"
              required
            >

            <label for="category">Category</label>
            <select id="category" required>
              <option value="">Select category</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>

            <label for="expenseDate">Date</label>
            <input id="expenseDate" type="date" required>

            <div class="form-actions">
              <button id="submitButton" class="primary-btn" type="submit">
                Add Expense
              </button>
              <button id="cancelButton" class="secondary-btn hidden" type="button">
                Cancel Edit
              </button>
            </div>
          </form>

          <p id="statusMessage" class="status-message"></p>
        </div>

        <div class="panel expenses-panel">
          <div class="panel-heading list-heading">
            <div>
              <p class="eyebrow">HISTORY</p>
              <h2>Your Expenses</h2>
            </div>
            <button id="refreshButton" class="refresh-btn" type="button">
              Refresh
            </button>
          </div>

          <div id="loading" class="empty-state">Loading expenses...</div>

          <div id="emptyState" class="empty-state hidden">
            No expenses yet. Add your first expense.
          </div>

          <div class="table-wrapper">
            <table id="expenseTable">
              <thead>
                <tr>
                  <th>Description</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th>Amount</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="expenseList"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
