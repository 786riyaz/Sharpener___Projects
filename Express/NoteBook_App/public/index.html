<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notebook App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- ==========================
             HEADER
        =========================== -->

        <header>

            <div class="logo">

                <h1>📒 Notebook</h1>

                <p>Keep your thoughts organized.</p>

            </div>


            <!-- SEARCH -->

            <div class="search-section">

                <label for="searchBox">
                    Search Notes
                </label>

                <input type="text" id="searchBox" placeholder="Search by title...">

                <div class="counter">

                    <span>
                        Total Notes :
                        <strong id="totalNotes">0</strong>
                    </span>

                    <span>
                        Showing :
                        <strong id="showingNotes">0</strong>
                    </span>

                </div>

            </div>

        </header>


        <!-- ==========================
             CREATE / EDIT FORM
        =========================== -->

        <section class="note-form">

            <h2 id="formHeading">
                Create New Note
            </h2>


            <form id="noteForm" onsubmit="handleFormSubmit(event)">

                <!-- TITLE -->

                <label for="title">
                    Note Title
                </label>

                <input type="text" id="title" placeholder="Enter note title" required>


                <!-- DESCRIPTION -->

                <label for="description">
                    Description
                </label>

                <textarea id="description" rows="6" placeholder="Write your note here..." required></textarea>


                <!-- SUBMIT -->

                <button type="submit" id="submitButton">
                    ➕ Add Note
                </button>


                <!-- CANCEL EDIT -->

                <button type="button" id="cancelButton" onclick="cancelEdit()" style="
                        display: none;
                        margin-top: 10px;
                        background: #64748b;
                    ">
                    ✖ Cancel Edit
                </button>

            </form>

        </section>


        <!-- ==========================
             NOTES
        =========================== -->

        <section class="notes-section">

            <h2>
                My Notes
            </h2>


            <div id="notesContainer" class="notes-grid">
            </div>

        </section>

    </div>


    <!-- ==========================
         AXIOS
    =========================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js">
    </script>


    <!-- ==========================
         APPLICATION JS
    =========================== -->

    <script src="index.js">
    </script>

</body>

</html>
