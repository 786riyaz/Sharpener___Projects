<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Expanse Tracker</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div class="dashboard">
        <div id="premiumHeadline" class="premium-headline" style="display: none;">
            &#127881; You are a premium user now
        </div>
        <div id="paymentBanner" class="payment-banner" style="display: none;"></div>
        <div class="dash-header">
            <h1 id="welcomeMsg">Welcome</h1>
            <div class="header-actions">
                <span id="premiumBadge" class="premium-badge" style="display: none;">&#9733; Premium Member</span>
                <a href="/reports.html" id="reportsBtn" class="btn-leaderboard">Reports</a>
                <button id="leaderboardBtn" class="btn-leaderboard" style="display: none;">Leader Board</button>
                <button id="buyPremiumBtn" class="btn-premium" style="display: none;">Buy Premium Membership</button>
                <button id="logoutBtn">Log out</button>
            </div>
        </div>
        <p id="ai-tip"></p>
        <div class="summary-card">
            <div class="summary-label">Total spent</div>
            <div class="summary-amount">₹<span id="totalAmount">0.00</span></div>
        </div>
        <div class="card">
            <h2>Add an expense</h2>
            <form id="expenseForm" class="expense-form" novalidate>
                <div class="full">
                    <label for="amount">Amount spent (₹)</label>
                    <input type="number" id="amount" name="amount" min="0.01" step="0.01" required />
                </div>
                <div class="full">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" placeholder="e.g. Lunch with team"
                        required />
                </div>
                <div class="full">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Petrol">Petrol</option>
                        <option value="Salary">Salary</option>
                        <option value="Rent">Rent</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="full">
                    <label for="note">Note (optional)</label>
                    <input type="text" id="note" name="note" placeholder="e.g. Paid via UPI" maxlength="255" />
                </div>
                <button type="submit" class="btn-primary">Add expense</button>
            </form>
            <div class="error-msg" id="errorMsg"></div>
        </div>
        <div class="card">
            <h2>Your expenses</h2>
            <table id="expenseTable">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Note</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display: none;">No expenses yet. Add your first one above.
            </div>
            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevPageBtn" class="btn-page" type="button">&larr; Prev</button>
                <span id="pageInfo" class="page-info"></span>
                <button id="nextPageBtn" class="btn-page" type="button">Next &rarr;</button>
                <label class="page-size-label" for="pageSizeSelect">Show
                    <select id="pageSizeSelect" class="page-size-select"></select>
                    per page</label>
            </div>
        </div>
    </div>
    <div id="leaderboardModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Leader Board</h2>
                <button id="closeLeaderboardBtn" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <ol id="leaderboardList" class="leaderboard-list"></ol>
            <div class="empty-state" id="leaderboardEmpty" style="display: none;">No expenses recorded yet.</div>
        </div>
    </div>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
