<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Socket.IO Chat</h1>
        <h2>Create Account</h2>

        <form id="signupForm">
            <label for="name">
                Name
            </label>

            <input
                id="name"
                type="text"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                required
            >

            <label for="phone">
                Phone Number
            </label>

            <input
                id="phone"
                type="tel"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                required
            >

            <button type="submit">
                Sign Up
            </button>
        </form>

        <p id="errorMessage"></p>

        <p>
            Already have an account?
            <a href="/login.html">
                Login
            </a>
        </p>
    </div>

    <script src="/js/signup.js"></script>
</body>
</html>
