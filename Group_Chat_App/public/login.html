<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Socket.IO Chat</h1>
        <h2>Welcome Back</h2>

        <form id="loginForm">
            <label for="login">
                Email or Phone Number
            </label>

            <input
                id="login"
                type="text"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                required
            >

            <button type="submit">
                Login
            </button>
        </form>

        <p id="errorMessage"></p>

        <p>
            Don't have an account?
            <a href="/signup.html">
                Sign Up
            </a>
        </p>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
