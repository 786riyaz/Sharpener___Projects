<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Socket.IO Personal Chat</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Socket.IO Chat</h1>

        <div class="header-user">
            <span id="currentUser"></span>
            <button id="logoutButton">
                Logout
            </button>
        </div>
    </header>

    <main class="app">
        <aside class="sidebar">
            <h2>Users</h2>

            <form
                id="searchForm"
                class="search-form"
            >
                <input
                    id="searchInput"
                    type="email"
                    placeholder="Enter registered user email"
                    autocomplete="off"
                >

                <button
                    type="submit"
                    id="joinUserButton"
                >
                    Verify & Join
                </button>
            </form>

            <p
                id="searchStatus"
                class="search-status"
            >
                Enter an exact registered email to verify the user before joining a room.
            </p>

            <div
                id="usersList"
                class="users-list"
            ></div>
        </aside>

        <section class="chat-section">
            <div class="chat-top">
                <h2 id="chatTitle">
                    Select a user to start personal chat
                </h2>
            </div>

            <div
                id="messages"
                class="messages"
            ></div>

            <form
                id="messageForm"
                class="message-form"
            >
                <input
                    id="messageInput"
                    type="text"
                    placeholder="Type a message here"
                    autocomplete="off"
                    disabled
                >

                <button
                    type="submit"
                    id="sendButton"
                    disabled
                >
                    Send
                </button>
            </form>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/index.js"></script>
</body>
</html>
