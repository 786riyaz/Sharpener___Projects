services:
- type: web
name: socketio-chat-exercise-18
runtime: node
buildCommand: npm install
startCommand: npm start
healthCheckPath: /
envVars:
- key: NODE_ENV
value: production
- key: MONGODB_URI
sync: false
- key: JWT_SECRET
generateValue: true
- key: AWS_REGION
sync: false
- key: AWS_ACCESS_KEY_ID
sync: false
- key: AWS_SECRET_ACCESS_KEY
sync: false
- key: S3_BUCKET_NAME
sync: false
- key: AI_SUGGESTIONS_ENABLED
value: false
- key: GEMINI_API_KEY
sync: false
- key: GEMINI_MODEL
value: gemini-3.5-flash-lite